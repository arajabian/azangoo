<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- a link page for other sites: not meant for search engines, so it is not in the sitemap and says noindex -->
<meta name="robots" content="noindex, nofollow">
<title>Azangoo</title>
<base href="../">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/azan.css?v=20261139">
<style>
.go{max-width:560px;margin:0 auto;padding:24px 14px}
.go h1{font-size:1.25rem;margin:0 0 8px;color:var(--heading)}
.go p{margin:0 0 14px;line-height:1.9}
.go label{display:block;margin:12px 0 4px;font-weight:700;font-size:.9rem}
.go input,.go select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-strong);color:var(--text);font:inherit}
.go .row{display:flex;gap:8px;margin-top:6px}
.go .row input{flex:1;direction:ltr;text-align:left}
.go button,.go a.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.go .test{display:inline-block;margin-top:12px}
.go .note{font-size:.85rem;color:var(--muted);margin-top:14px}
.go .ui{float:inline-end;width:auto;padding:6px 8px;font-size:.85rem}
</style>
</head>
<body>
<main class="go">
  <section class="card" id="goCard"><noscript>JavaScript is needed. <a href="en/">Azangoo</a></noscript></section>
</main>
<script src="js/go.js?v=20261140"></script>
</body>
</html>
